name: Validate BAG

on:
  push:
  pull_request:

jobs:
  catalog-and-links:
    name: Catalog, tests and local links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node spellbook/scripts/validate.mjs
      - run: node spellbook/scripts/bag.mjs validate --json
      - run: node --test tests/*.test.mjs
