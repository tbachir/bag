name: Build and publish BAG docs

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'inventory/**'
      - 'equipment/**'
      - 'skill-tree/**'
      - 'spellbook/**'
      - 'maps-and-guides/**'
      - 'loot/**'
      - 'loadouts/**'
      - 'catalog/**'
      - 'templates/**'
      - 'demo/**'
      - '*.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Static docs (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - name: root
            base_path: ''
          - name: github-pages
            base_path: /bag
    defaults:
      run:
        working-directory: apps/docs
    env:
      DOCS_BASE_PATH: ${{ matrix.base_path }}
      DOCS_SITE_URL: https://tbachir.github.io
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm types:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: bag-docs-${{ matrix.name }}
          path: apps/docs/out
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-test-results-${{ matrix.name }}
          path: apps/docs/test-results
      # upload-pages-artifact excludes dotfiles, including BAG's downloadable
      # .editorconfig/.gitignore templates. Keep them in the Pages tar contract.
      - name: Package Pages artifact including configuration templates
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && matrix.name == 'github-pages'
        run: tar --directory out --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && matrix.name == 'github-pages'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1

  deploy:
    name: Publish GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish validated export
        id: deployment
        uses: actions/deploy-pages@v4
